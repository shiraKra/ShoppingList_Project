<div class="premium-viewport" dir="rtl">
  <div class="edit-card">
    <h2>עריכת <span style="color:#e94560">מוצר</span></h2>
    
    <div class="form-group">
      <label>שם הפריט</label>
      <input type="text" [(ngModel)]="item.ItemName">
    </div>

    <div class="form-group">
      <label>בחר קטגוריה</label>
      <select [(ngModel)]="item.CategoryId" class="premium-select">
        @for (cat of categories; track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="button-group">
      <button class="btn-save" (click)="onSave()">שמור שינויים</button>
      <button class="btn-cancel" [routerLink]="['/items-list']">ביטול</button>
    </div>
  </div>
</div>
